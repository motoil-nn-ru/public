name: Reusable Deploy

on:
  workflow_call:
    secrets:
      NEXUS_HOST:
        required: true
      NEXUS_USER:
        required: true
      NEXUS_PASSWORD:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Обычная выкатка - до 5 мин (сборка jar ~1-4 мин, перезапуск ~20 с). Зависшая сборка висела бы до 6 ч
    # (2026-10-22: customer-service hotfix, «Publish to Nexus» > 15 мин) - обрываем раньше.
    timeout-minutes: 20
    # Запуски одного сервиса - по очереди: параллельные публиковали одну версию и падали на
    # «cannot be updated» (2026-10-21, max-bot-service). Следующий в очереди увидит jar в Nexus и пропустит сборку.
    concurrency:
      group: ${{ github.workflow }}-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set service name
        id: meta
        run: echo "service=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version=' version.properties | cut -d'=' -f2 | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if JAR exists in Nexus
        id: check
        run: |
          ITEMS=$(curl -s \
            -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" \
            "https://${{ secrets.NEXUS_HOST }}/service/rest/v1/search/assets?repository=maven-releases&maven.groupId=ru.motoil-nn&maven.artifactId=${{ steps.meta.outputs.service }}&maven.baseVersion=${{ steps.version.outputs.version }}&maven.extension=jar" \
            | grep -c '"downloadUrl"' || true)
          if [ "$ITEMS" -gt "0" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'false'
        with:
          java-version: '25'
          distribution: 'temurin'

      # Кэш Gradle (дистрибутив, зависимости, build cache) полнее, чем cache: 'gradle' у setup-java.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.exists == 'false'

      - name: Publish to Nexus
        if: steps.check.outputs.exists == 'false'
        timeout-minutes: 10
        run: |
          chmod +x gradlew
          ./gradlew publish \
            -PmotulNexusUrl="https://${{ secrets.NEXUS_HOST }}/repository/maven-public/" \
            -PmotulNexusPublishingUrl="https://${{ secrets.NEXUS_HOST }}/repository/maven-releases/" \
            -PmotulNexusUser="${{ secrets.NEXUS_USER }}" \
            -PmotulNexusPassword="${{ secrets.NEXUS_PASSWORD }}" \
            -x test --build-cache

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # config-server отдаёт конфиги с volume-mount ./infrastructure/config-server/configs -
            # это отдельный git checkout (свой репозиторий motoil-nn-ru/config-server), который
            # НЕ обновляется деплоем этого workflow сам по себе (docker compose build/up ниже
            # трогает только контейнер ${{ steps.meta.outputs.service }}). Без этого шага новые
            # конфиги реально попадают на сервер только при ручном git pull - см. инцидент
            # 2026-09-17 (notification-service падал на старте из-за отсутствующего в config-server
            # свойства, которое уже было замержено в main, но не подтянуто на сервере).
            cd /opt/motul/infrastructure/config-server && git pull --ff-only
            cd /opt/motul
            docker compose build --no-cache ${{ steps.meta.outputs.service }}
            docker compose rm -sf ${{ steps.meta.outputs.service }}
            # --no-deps: поднимаем только свой сервис. Без него compose пересоздавал и зависимости, если их конфигурация
            # изменилась (общий .env) - параллельные деплои пересоздавали одни и те же контейнеры и оставляли их
            # в «Created» (2026-10-11: customer/order/portal на тесте лежали после четырёх деплоев разом).
            docker compose up -d --no-deps ${{ steps.meta.outputs.service }}
            # Сборка всегда --no-cache: прежний образ сервиса становится «висячим», кэш сборки не нужен -
            # без очистки кэш дорос до 20 ГБ (2026-10, диск 86%). Только неиспользуемое и старше часа -
            # сборки параллельных деплоев не задеваем.
            docker image prune -f --filter "until=1h" >/dev/null 2>&1 || true
            docker builder prune -af --filter "until=1h" >/dev/null 2>&1 || true
