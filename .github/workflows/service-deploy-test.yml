name: Reusable Deploy (Test)

on:
  workflow_call:
    secrets:
      NEXUS_HOST:
        required: true
      NEXUS_USER:
        required: true
      NEXUS_PASSWORD:
        required: true
      TEST_DEPLOY_HOST:
        required: true
      TEST_DEPLOY_USER:
        required: true
      TEST_DEPLOY_SSH_KEY:
        required: true
      TEST_DEPLOY_PORT:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Обычная выкатка - до 5 мин (сборка jar ~1-4 мин, перезапуск ~20 с). Зависшая сборка висела бы до 6 ч
    # (2026-10-22: customer-service hotfix, «Publish to Nexus» > 15 мин) - обрываем раньше.
    timeout-minutes: 20
    # Запуски одного сервиса - по очереди: параллельные публиковали одну версию и падали на
    # «cannot be updated» (2026-10-21, max-bot-service). Следующий в очереди увидит jar в Nexus и пропустит сборку.
    concurrency:
      group: ${{ github.workflow }}-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set service name
        id: meta
        run: echo "service=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version=' version.properties | cut -d'=' -f2 | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if JAR exists in Nexus
        id: check
        run: |
          ITEMS=$(curl -s \
            -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" \
            "https://${{ secrets.NEXUS_HOST }}/service/rest/v1/search/assets?repository=maven-releases&maven.groupId=ru.motoil-nn&maven.artifactId=${{ steps.meta.outputs.service }}&maven.baseVersion=${{ steps.version.outputs.version }}&maven.extension=jar" \
            | grep -c '"downloadUrl"' || true)
          if [ "$ITEMS" -gt "0" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'false'
        with:
          java-version: '25'
          distribution: 'temurin'

      # Кэш Gradle (дистрибутив, зависимости, build cache) полнее, чем cache: 'gradle' у setup-java.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.exists == 'false'
        with:
          # Тест выкатывается из development, не из ветки по умолчанию - иначе кэш только читался бы.
          cache-read-only: false

      - name: Publish to Nexus
        if: steps.check.outputs.exists == 'false'
        timeout-minutes: 10
        run: |
          chmod +x gradlew
          ./gradlew publish \
            -PmotulNexusUrl="https://${{ secrets.NEXUS_HOST }}/repository/maven-public/" \
            -PmotulNexusPublishingUrl="https://${{ secrets.NEXUS_HOST }}/repository/maven-releases/" \
            -PmotulNexusUser="${{ secrets.NEXUS_USER }}" \
            -PmotulNexusPassword="${{ secrets.NEXUS_PASSWORD }}" \
            -x test --build-cache

      - name: Deploy to test server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_DEPLOY_HOST }}
          username: ${{ secrets.TEST_DEPLOY_USER }}
          key: ${{ secrets.TEST_DEPLOY_SSH_KEY }}
          port: ${{ secrets.TEST_DEPLOY_PORT }}
          script: |
            # См. комментарий в service-deploy.yml (Reusable Deploy) - тот же разрыв, тот же фикс.
            # Путь тестового checkout config-server не подтверждён (по .env.test.example тестовый
            # config-server может читать конфиги из ТОГО ЖЕ ./infrastructure/config-server, что и
            # боевой, а не из отдельной копии под /opt/motul-test) - поэтому не роняем деплой, если
            # каталог здесь не найден или git pull не удался.
            (cd /opt/motul-test/infrastructure/config-server 2>/dev/null && git pull --ff-only) || true
            cd /opt/motul-test
            docker compose --env-file .env.test -f docker-compose.test.yml build --no-cache ${{ steps.meta.outputs.service }}
            docker compose --env-file .env.test -f docker-compose.test.yml rm -sf ${{ steps.meta.outputs.service }}
            # --no-deps: поднимаем только свой сервис. Без него compose пересоздавал и зависимости, если их конфигурация
            # изменилась (общий .env) - параллельные деплои пересоздавали одни и те же контейнеры и оставляли их
            # в «Created» (2026-10-11: customer/order/portal на тесте лежали после четырёх деплоев разом).
            docker compose --env-file .env.test -f docker-compose.test.yml up -d --no-deps ${{ steps.meta.outputs.service }}
            # Сборка всегда --no-cache: прежний образ сервиса становится «висячим», кэш сборки не нужен -
            # без очистки каждый деплой оставлял на диске ~0,5 ГБ (2026-10: хост заполнился до 91%).
            # Только неиспользуемое и старше часа - сборки параллельных деплоев не задеваем.
            docker image prune -f --filter "until=1h" >/dev/null 2>&1 || true
            docker builder prune -af --filter "until=1h" >/dev/null 2>&1 || true
